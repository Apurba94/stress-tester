[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-tester"
version = "0.1.0"
description = "Stress testing engine: runs a solution against a brute force on thousands of random tests, finds counterexamples, shrinks them to minimal failing inputs and records reproducible seeds."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
stress-tester = "stress_tester.cli:main"

[tool.setuptools]
packages = ["stress_tester"]
